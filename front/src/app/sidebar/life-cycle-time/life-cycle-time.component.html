<div style="position: relative">
  <div class="d-flex" style="gap: 2%;">
    <div class="bg-white p-3" style="width: 20%; height: fit-content;">
      <h3>Pourcentage</h3>
      <div>
        <canvas baseChart [data]="doughnutChartData" [type]="'doughnut'"></canvas>
      </div>
    </div>
    <div style="width: 78%;" class=" bg-white p-3">
      <h3>Graphe</h3>
      <div class="w-100 position-relative">
        <canvas baseChart [datasets]="bubbleChartData" [options]="bubbleChartOptions" [type]="'bubble'"></canvas>
        <div id="bubble-info" class="bubble-info">
          <p><span class="fw-bold">Application: </span><span id="app-name"></span></p>
          <p>
            <span class="fw-bold">Valeur Métier: </span> <span id="app-value"></span>
          </p>
          <p>
            <span class="fw-bold">Dette Technique: </span> <span id="app-cost"></span>
          </p>
          <p>
            <span class="fw-bold">Type: </span>
            <span id="app-type" class="fw-bold"></span>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
