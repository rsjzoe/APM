<div class="">
  <div class="stepped-process">

    <ol>
      <li class="stepped-process-item {{activeTab == 'techBusiness' ? 'active' : ''}}"
        (click)="setActiveTab('techBusiness')" style="cursor: pointer;">
        <span class="stepped-process-link">
          Valeur Métier et Dette Technique
        </span>
      </li>
      <li class="stepped-process-item {{activeTab == 'cost' ? 'active' : ''}}" (click)="setActiveTab('cost')"
        style="cursor: pointer;">
        <span class="stepped-process-link">
          Coût de Construction et d'Exploitation</span>
      </li>
    </ol>
  </div>
  <div class="chart-container" *ngIf="activeTab == 'techBusiness'">
    <div style="display: flex; align-items: center; gap: 1rem;">
      <h6 style="margin: 0;">Valeur Métier et Dette Technique</h6>
      <select [(ngModel)]="selectedYear" (change)="onYearChange()">
        <option *ngFor="let year of years" [value]="year">{{ year }}</option>
      </select>
    </div>
    <p *ngIf="loading">chargement...</p>
    <canvas #chartCanvasTechBusiness></canvas>
  </div><br>
  <div class="chart-container" *ngIf="activeTab == 'cost'">
    <div style="display: flex; align-items: center; gap: 1rem;">
      <h6 style="margin: 0;">Coût de Construction et d'Exploitation</h6>
      <select [(ngModel)]="selectedYear" (change)="onYearChange()">
        <option *ngFor="let year of years" [value]="year">{{ year }}</option>
      </select>
    </div>
    <p *ngIf="loading">chargement...</p>
    <canvas #chartCanvasCost></canvas>
  </div>
</div>
