<div class="document-list" *ngIf="groupedDocuments != null">
  <div class="document-group" *ngFor="let group of groupedDocuments | keyvalue">
    <div class="d-flex align-items-center gap-2">
      <app-icon-technique *ngIf="group.key == 'technique'" />
      <app-icon-exploitation *ngIf="group.key == 'exploitation'" />
      <app-icon-fonctionnelle *ngIf="group.key == 'fonctionnelle'" />
      <span class="text-black h5 mb-0" [class]="getDocumentTypeClass(group.key)">
        {{ group.key }}
      </span>
    </div>

    <div class="document-item d-flex justify-content-between align-items-center p-2 ms-3"
      *ngFor="let doc of group.value">
      <div class="document-info d-flex align-items-end gap-2">
        <app-icon-document></app-icon-document>
        <span>{{ doc.name }}</span>
      </div>

      <div class="document-actions d-flex gap-2">
        <button *ngIf="canDeleteDoc$ | async" class="button-icon" aria-label="Supprimer" data-bs-toggle="modal"
          data-bs-target="#modalConfirm" data-bs-dismiss="modal" (click)="saveIdAppDelete(doc.filename)">
          <app-icon-delete />
        </button>
        <button class="button-icon" (click)="handleView(doc)">
          <app-icon-view></app-icon-view>
        </button>
        <button class="button-icon" (click)="handleDownload(doc)">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </button>
      </div>
    </div>
  </div>
  <app-modal-confirm [onConfirm]="onConfirmDelete"></app-modal-confirm>
  <app-modal-add-documentation [applicationId]="applicationId" [refresh]="refresh" />
</div>
