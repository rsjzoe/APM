<div class="accordion-item">
  <h2 class="accordion-header">
    <button class="accordion-button collapsed  py-3" type="button" data-bs-toggle="collapse"
      data-bs-target="#collapseThree" aria-expanded="false" aria-controls="collapseThree" style="font-size: 18px;">
      Date et status
    </button>
  </h2>
  <div id="collapseThree" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
    <div class="accordion-body">
      <!-- Checkboxes -->
      <div class="mb-3 d-grid gap-2">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" [(ngModel)]="modalStateService.openFields.startDate"
            id="editStartDate" name="editStartDate" />
          <label class="form-check-label" for="editStartDate">Date de mise en production</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" [(ngModel)]="modalStateService.openFields.lastUpdate"
            id="editLastUpdate" name="editLastUpdate" />
          <label class="form-check-label" for="editLastUpdate">Dernière mise à jour</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" [(ngModel)]="modalStateService.openFields.status"
            id="editStatus" name="editStatus" />
          <label class="form-check-label" for="editStatus">Status</label>
        </div>
      </div>

      <!-- Input fields -->
      <app-form-date-status />
    </div>
  </div>
</div>
