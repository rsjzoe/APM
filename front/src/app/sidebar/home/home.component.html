<div class="main-content">
  <app-modal-add-app />
  <app-modal-edit-app />

  <div class="d-grid gap-3">
    <!-- bouton -->
    <div class="d-flex justify-content-between" style="padding-top: 10px">
      <div class="">
        <div class="input-group mb-3 input-dropdown ">
          <button class="btn btn-dropdown dropdown-toggle" type="button" data-bs-toggle="dropdown"
            aria-expanded="false">Département</button>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item">Classe</a></li>
            <li><a class="dropdown-item">Catégorie</a></li>
          </ul>
        </div>
      </div>
      <div (click)="onClickAdd()" *ngIf="userService.canAdd()">
        <app-button text="Ajouter une nouvelle application" data-bs-toggle="modal"
          data-bs-target="#applicationEditModal" data-bs-dismiss="modal"
          iconPath="M850,400H600V150a50,50,0,0,0-50-50H450a50,50,0,0,0-50,50V400H150a50,50,0,0,0-50,50V550a50,50,0,0,0,50,50H400V850a50,50,0,0,0,50,50H550a50,50,0,0,0,50-50V600H850a50,50,0,0,0,50-50V450A50,50,0,0,0,850,400Z">
        </app-button>
      </div>
    </div>

    <!-- liste app  -->
    <table class="table">
      <thead>
        <tr>
          <th scope="col">Nom</th>
          <th scope="col">Status</th>
          <th scope="col">
            Département

          </th>
          <th scope="col" *ngIf="userService.canEdit() || userService.canDelete()">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let app of apps" (click)="goToDetail(app.id)" style="cursor: pointer">
          <th scope="row">{{ app.name }}</th>
          <td>
            <span class="status badge text-white rounded-pill" [ngClass]="getStatusColor(app.status)">
              {{ app.status }}
            </span>
          </td>
          <td>
            <div class="meta-item d-flex align-items-center gap-1">
              <span>{{app.departement.name}}
              </span>
            </div>
          </td>
          <td *ngIf="userService.canEdit() || userService.canDelete()">
            <div class="action-buttons">
              <button class="btn btn-sm bg-info edit text-white" aria-label="Modifier" *ngIf="userService.canEdit()"
                (click)="editApp(app); $event.stopPropagation()" data-bs-toggle="modal" data-bs-target="#modalEditApp"
                data-bs-dismiss="modal">
                <app-icon-edit></app-icon-edit>
              </button>
              <button class="btn btn-danger btn-sm delete" aria-label="Supprimer" data-bs-toggle="modal"
                data-bs-target="#modalConfirm" data-bs-dismiss="modal"
                (click)="saveIdAppDelete(app.id); $event.stopPropagation()" *ngIf="userService.canDelete()">
                <!-- (click)="deleteById(app.id); $event.stopPropagation()" -->

                <app-icon-delete></app-icon-delete>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <app-modal-confirm [onConfirm]="onConfirmDelete"></app-modal-confirm>
  <!-- pied de page -->
  <nav aria-label="Page navigation " class="position-relative" style="top: 80px">
    <ul class="pagination justify-content-center">
      <li class="page-item disabled">
        <a class="page-link">Prev</a>
      </li>
      <li class="page-item"><a class="page-link">1</a></li>
      <li class="page-item active"><a class="page-link">2</a></li>
      <li class="page-item"><a class="page-link">3</a></li>
      <li class="page-item">
        <a class="page-link">Next</a>
      </li>
    </ul>
  </nav>
</div>
