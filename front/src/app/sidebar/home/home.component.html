<div class="d-grid gap-4">
  <app-button
    iconPath="M850,400H600V150a50,50,0,0,0-50-50H450a50,50,0,0,0-50,50V400H150a50,50,0,0,0-50,50V550a50,50,0,0,0,50,50H400V850a50,50,0,0,0,50,50H550a50,50,0,0,0,50-50V600H850a50,50,0,0,0,50-50V450A50,50,0,0,0,850,400Z"
    text="Ajouter Application" data-bs-target="#exampleModalToggle" data-bs-toggle="modal"></app-button>

  <div class="grid-card-app d-grid gap-4">
    <app-card *ngFor="let app of apps" [app]="app"></app-card>
  </div>
</div>

<div class="modal fade modal-lg" id="exampleModalToggle" aria-hidden="true" data-bs-backdrop="false"
  aria-labelledby="exampleModalToggleLabel" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title h5" id="exampleModalToggleLabel">Modal 1</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" data-bs-toggle="tooltip"
          data-bs-placement="bottom" data-bs-title="Close">
          <span class="visually-hidden">Close</span>
        </button>
      </div>
      <div class="modal-body">
        Show a second modal and hide this one with the button below.
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" data-bs-target="#exampleModalToggle2" data-bs-toggle="modal">
          Open second modal
        </button>
      </div>
    </div>
  </div>
</div>
<div class="modal modal-lg fade" id="exampleModalToggle2" aria-hidden="true" data-bs-backdrop="false"
  aria-labelledby="exampleModalToggleLabel2" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title h5" id="exampleModalToggleLabel2">Modal 2</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" data-bs-toggle="tooltip"
          data-bs-placement="bottom" data-bs-title="Close">
          <span class="visually-hidden">Close</span>
        </button>
      </div>
      <div class="modal-body">
        Hide this modal and show the first with the button below.
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" data-bs-target="#exampleModalToggle" data-bs-toggle="modal">
          Back to first
        </button>
      </div>
    </div>
  </div>
</div>
