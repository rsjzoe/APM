<div class="main-content">
  <app-modal-add-app />
  <app-modal-edit-app />

  <div class="app-list-container">
    <h1>Liste des applications</h1>

    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/home">Application</a></li>
        <li class="breadcrumb-item active" aria-current="page">Liste</li>
      </ol>
    </nav>

    <div class="d-grid gap-3">
      <!-- bouton -->
      <div class="d-flex justify-content-between align-items-center">
        <div class="d-flex">
          <form class="d-flex" role="search">
            <div class="input-group">
              <span class="position-relative w-100">
                <input class="input-search form-control ps-5" type="search" placeholder="Search..." aria-label="Search"
                  style="background-color: transparent !important; height: 44px" />
                <svg class="position-absolute top-50 start-0 translate-middle-y ms-2" width="24" height="24">
                  viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path fill="#000" fill-rule="evenodd"
                    d="M892.285,819.383L666.631,593.728a310.794,310.794,0,0,0,58.05-181.388c0-172.5-139.839-312.34-312.341-312.34S100,239.838,100,412.34,239.838,724.681,412.34,724.681a310.918,310.918,0,0,0,181.4-58.05L819.383,892.275a25.053,25.053,0,0,0,35.342,0l37.56-37.55A25.071,25.071,0,0,0,892.285,819.383ZM412.34,624.732c-117.3,0-212.391-95.092-212.391-212.392S295.04,199.949,412.34,199.949,624.732,295.04,624.732,412.34,529.64,624.732,412.34,624.732Z"
                    transform="scale(.024)" />
                </svg>
              </span>
            </div>
          </form>
        </div>
        <div class="d-flex gap-2 justify-content-between align-items-center">
          <div>
            <div class="input-group input-dropdown">
              <button class="btn btn-dropdown dropdown-toggle" type="button" data-bs-toggle="dropdown"
                aria-expanded="false" style="height: 44px">
                Département
              </button>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item">Classe</a></li>
                <li><a class="dropdown-item">Catégorie</a></li>
              </ul>
            </div>
          </div>
          <div (click)="onClickAdd()" *ngIf="canAddApp$ | async">
            <app-button text="Ajouter" data-bs-toggle="modal" data-bs-target="#applicationEditModal"
              data-bs-dismiss="modal"
              iconPath="M850,400H600V150a50,50,0,0,0-50-50H450a50,50,0,0,0-50,50V400H150a50,50,0,0,0-50,50V550a50,50,0,0,0,50,50H400V850a50,50,0,0,0,50,50H550a50,50,0,0,0,50-50V600H850a50,50,0,0,0,50-50V450A50,50,0,0,0,850,400Z">
            </app-button>
          </div>
        </div>
      </div>

      <!-- liste app  -->
      <table class="table">
        <thead>
          <tr>
            <th scope="col">Nom</th>
            <th scope="col">Status</th>
            <th scope="col">Date de création</th>
            <th scope="col" *ngIf="canEditOrDelete$ | async">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let app of apps" (click)="goToDetail(app.id)" style="cursor: pointer">
            <th scope="row">{{ app.name }}</th>
            <td>
              <span class="status badge text-white rounded-pill" [ngClass]="getStatusColor(app.status)">
                {{ app.status }}
              </span>
            </td>

            <td class="text-muted">
              {{ formatDate(app.startDate) }}
            </td>
            <td *ngIf="canEditOrDelete$ | async">
              <div class="action-buttons">
                <button class="btn text-danger btn-sm delete" aria-label="Supprimer" data-bs-toggle="modal"
                  data-bs-target="#modalConfirm" data-bs-dismiss="modal"
                  (click)="saveIdAppDelete(app.id); $event.stopPropagation()" *ngIf="canDelete$ | async">
                  <!-- (click)="deleteById(app.id); $event.stopPropagation()" -->

                  <app-icon-delete></app-icon-delete>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
      <div class="text-center p-4" *ngIf="apps.length === 0">
        <p>Aucune application trouvée.</p>
      </div>
    </div>

    <app-modal-confirm [onConfirm]="onConfirmDelete"></app-modal-confirm>
    <!-- pied de page -->
    <nav aria-label="Page navigation " class="position-relative">
      <ul class="pagination justify-content-center">
        <li class="page-item disabled">
          <a class="page-link">Prev</a>
        </li>
        <li class="page-item"><a class="page-link">1</a></li>
        <li class="page-item active"><a class="page-link">2</a></li>
        <li class="page-item"><a class="page-link">3</a></li>
        <li class="page-item">
          <a class="page-link">Next</a>
        </li>
      </ul>
    </nav>
  </div>
</div>
