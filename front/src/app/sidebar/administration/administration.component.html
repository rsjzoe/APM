<!-- <p>administration works!</p>    -->

<div class="admin-container">

  <div class="d-flex">
    <app-button class="btn-adduser w-100" text="Ajouter utilisateur" data-bs-toggle="modal"
      data-bs-target="#exampleModal"
      iconPath="M850,400H600V150a50,50,0,0,0-50-50H450a50,50,0,0,0-50,50V400H150a50,50,0,0,0-50,50V550a50,50,0,0,0,50,50H400V850a50,50,0,0,0,50,50H550a50,50,0,0,0,50-50V600H850a50,50,0,0,0,50-50V450A50,50,0,0,0,850,400Z"
      *ngIf="canAdd$ | async"></app-button>

    <div class="input-group mb-3 input-dropdown d-flex justify-content-end">
      <button class="btn btn-dropdown dropdown-toggle" type="button" data-bs-toggle="dropdown"
        aria-expanded="false">Filtrer</button>
      <ul class="dropdown-menu">
        <li><a class="dropdown-item">utilisateur</a></li>
        <li><a class="dropdown-item">administration</a></li>

      </ul>
    </div>
  </div>

  <app-user-modal [isEditing]="isEditing" [addUser]="addUser" [updateUser]="updateUser"
    [userEditing]="userEditing"></app-user-modal>


  <div class="table-container position-relative" style="top: 50px">
    <table class="table table-striped" style="--bs-table-bg: none">
      <thead class="bg-dark text-white">
        <tr class="title-col text-white">
          <th scope="col">Nom</th>
          <th scope="col">Trigramme</th>
          <th scope="col">Département </th>
          <th scope="col">Rôle</th>
          <th scope="col" *ngIf="canEditOrDelete$ | async">Action</th>
        </tr>
      </thead>
      <tbody class="bg-white">
        <tr *ngFor="let user of users">
          <td>{{ user.name }}</td>
          <td>{{ user.trigramme }}</td>
          <td>{{ user.departement }}</td>
          <td>
            <span class="badge rounded-pill"
              [ngClass]="user.role == 'admin' ? 'text-bg-secondary' : (user.role == 'editor' ? 'text-bg-info' : 'text-bg-warning')">
              {{ user.role }}
            </span>
          </td>
          <td class="d-flex gap-2" *ngIf="canEditOrDelete$ | async">
            <div class="delete-icon" data-bs-toggle="modal" data-bs-target="#modalConfirm" data-bs-dismiss="modal"
              (click)="saveTrigrammeAppDelete(user.trigramme)" *ngIf="canDelete$ | async">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#CD3C14"
                class="solaris-icon si-trash" viewBox="0 0 1000 1000">
                <path
                  d="M750,149.959H625V125a50,50,0,0,0-50-50H425a50,50,0,0,0-50,50v24.959H250a75,75,0,0,0-75,75V275H825V224.959A75,75,0,0,0,750,149.959ZM425,125H575v24.959H425V125ZM225,299.959V925H775V299.959H225ZM375,400V824.865h0c0,0.045,0,.09,0,0.135a25,25,0,0,1-50,0c0-.045,0-0.09,0-0.135h0V400h0c0-.014,0-0.027,0-0.041a25,25,0,0,1,50,0c0,0.014,0,.027,0,0.041h0Zm150,0V824.864h0c0,0.046,0,.09,0,0.136a25,25,0,0,1-50,0c0-.046,0-0.09,0-0.136h0V400h0c0-.014,0-0.028,0-0.041a25,25,0,0,1,50,0c0,0.013,0,.027,0,0.041h0Zm150,0V824.865h0c0,0.045,0,.09,0,0.135a25,25,0,0,1-50,0c0-.045,0-0.09,0-0.135h0V400h0c0-.014,0-0.027,0-0.041a25,25,0,0,1,50,0c0,0.014,0,.027,0,0.041h0Z"
                  style="fill-rule: evenodd" />
              </svg>
            </div>
            <div class="edit-icon" (click)="editeUser(user)" data-bs-toggle="modal" data-bs-target="#exampleModal"
              *ngIf="canDelete$ | async">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#4170D8"
                class="solaris-icon si-pencil" viewBox="0 0 1000 1000">
                <path
                  d="M876.2,238.316l-51.077-51.108-63.846-63.884a81.085,81.085,0,0,0-68.3-23.078c-0.712.095-1.421,0.2-2.131,0.32-2.332.375-4.65,0.843-6.948,1.422-2.315.583-4.611,1.26-6.877,2.049-0.03.011-.061,0.019-0.091,0.03a80.92,80.92,0,0,0-30.578,19.257L186.663,583.292,133.137,759.716h0l-13.253,43.678L101.2,864.984c-0.185.61-.344,1.22-0.485,1.827-0.045.192-.078,0.383-0.119,0.575-0.087.415-.17,0.83-0.238,1.242-0.037.227-.066,0.453-0.1,0.68-0.052.378-.1,0.755-0.135,1.131-0.022.235-.04,0.468-0.057,0.7-0.025.369-.043,0.736-0.053,1.1-0.006.23-.012,0.46-0.013,0.689,0,0.376.01,0.75,0.025,1.123,0.008,0.211.013,0.422,0.027,0.632,0.027,0.425.069,0.847,0.116,1.267,0.018,0.152.028,0.305,0.048,0.456q0.111,0.855.276,1.693c0.021,0.108.05,0.214,0.072,0.322,0.095,0.448.2,0.894,0.313,1.334,0.051,0.191.11,0.379,0.165,0.568,0.1,0.354.207,0.705,0.323,1.053,0.07,0.207.145,0.412,0.219,0.617,0.118,0.326.24,0.649,0.37,0.969,0.084,0.207.171,0.412,0.259,0.617q0.207,0.473.431,0.935c0.095,0.2.188,0.393,0.288,0.587,0.164,0.322.339,0.638,0.516,0.952,0.095,0.171.188,0.343,0.287,0.511,0.227,0.385.467,0.761,0.713,1.134,0.059,0.09.114,0.183,0.175,0.273q0.464,0.685.969,1.341c0.1,0.127.2,0.248,0.3,0.373,0.246,0.308.493,0.614,0.752,0.911,0.135,0.156.277,0.307,0.415,0.46,0.234,0.257.47,0.512,0.713,0.76,0.155,0.158.313,0.312,0.472,0.467,0.241,0.234.486,0.465,0.736,0.69,0.165,0.15.33,0.3,0.5,0.443,0.259,0.224.524,0.441,0.792,0.655,0.167,0.132.331,0.266,0.5,0.395,0.3,0.228.6,0.445,0.912,0.66,0.147,0.1.29,0.21,0.438,0.309,0.459,0.308.926,0.605,1.405,0.885,0.021,0.013.043,0.024,0.065,0.036q0.687,0.4,1.4.759c0.162,0.082.329,0.156,0.494,0.235,0.337,0.163.677,0.323,1.022,0.472,0.2,0.084.395,0.162,0.592,0.241,0.324,0.131.65,0.257,0.979,0.375,0.209,0.075.419,0.146,0.631,0.216q0.493,0.162.995,0.306c0.212,0.061.424,0.122,0.638,0.177,0.352,0.092.706,0.172,1.062,0.249,0.2,0.044.4,0.091,0.6,0.129,0.415,0.08.835,0.145,1.256,0.206,0.147,0.021.291,0.048,0.438,0.067q0.856,0.106,1.726.159c0.117,0.007.236,0.006,0.353,0.0                   style="fill-rule: evenodd" />
              </svg>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
    <div class="text-center" *ngIf="users.length === 0">
      <p>Aucun utilisateur trouvé</p>
  </div>
  <app-modal-confirm [onConfirm]="onConfirmDelete"></app-modal-confirm>

  <nav aria-label="Page navigation " class="position-relative" style="top: 80px">
    <ul class="pagination justify-content-center">
      <li class="page-item disabled">
        <a class="page-link">Prev</a>
      </li>
      <li class="page-item"><a class="page-link">1</a></li>
      <li class="page-item active"><a class="page-link">2</a></li>
      <li class="page-item"><a class="page-link">3</a></li>
      <li class="page-item">
        <a class="page-link">Next</a>
      </li>
    </ul>
  </nav>
</div>
