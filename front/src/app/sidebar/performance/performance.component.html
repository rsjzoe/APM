<div class="question-container d-grid gap-4">
  <div
    class="question-header d-flex justify-content-between align-items-center"
  >
    <h3 class="question-title">Gestionnaire de Questions</h3>
    <app-button
      text="Ajouter question"
      data-bs-toggle="modal"
      data-bs-target="#quesitionModalForm"
      iconPath="M850,400H600V150a50,50,0,0,0-50-50H450a50,50,0,0,0-50,50V400H150a50,50,0,0,0-50,50V550a50,50,0,0,0,50,50H400V850a50,50,0,0,0,50,50H550a50,50,0,0,0,50-50V600H850a50,50,0,0,0,50-50V450A50,50,0,0,0,850,400Z"
    ></app-button>
  </div>
  <div class="questionsList d-grid gap-3">
    <app-question-card
      *ngFor="let question of questions"
      [question]="question"
      [deleteQuestion]="deleteQuestion"
      [editQuestion]="editQuestion"
    ></app-question-card>
  </div>
</div>
<app-modal-question-form
  [isEditingId]="isEditingId"
  [addQuestion]="addQuestion"
  [updateQuestion]="updateQuetion"
  [questionEditing]="questionEditing"
></app-modal-question-form>
