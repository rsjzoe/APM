<div class="modal fade modal-lg" id="quesitionModalForm" tabindex="-1" aria-labelledby="quesitionModalFormLabel"
  aria-hidden="true" data-bs-backdrop="false">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="quesitionModalFormLabel">
          Ajouter une question
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" data-bs-toggle="tooltip"
          data-bs-placement="bottom" data-bs-title="Close">
          <span class="visually-hidden">Close</span>
        </button>
      </div>
      <div class="modal-body">
        <div>
          <div class="mb-3">
            <label for="valueQuestion" class="col-form-label">Ajouter un groupe de question</label>
            <input type="text" id="valueQuestion" class="form-control" [(ngModel)]="valueQuestion"
              placeholder="Entrez votre question" />
          </div>
          <div class="mb-3">
            <label for="coefficient" class="col-form-label">Coeffficient <span class="text-muted">(échelle de 1 à
                10)</span>:</label>
            <input type="number" id="coefficient" class="form-control" placeholder="Entrez coefficient" [(ngModel)]="valueCoeff"/>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
          Annuler
        </button>
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal" (click)="add()" *ngIf="!isEditingId">
          Enregistrer
        </button>
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal" (click)="update()" *ngIf="isEditingId">
          Mettre à jour
        </button>
      </div>
    </div>
  </div>
</div>
