<div class="">
    <h2 class="mb-4">Modifier un rôle</h2>

    <div>

        <div class="card mb-4">
            <div class="card-header">
                <h3 class="h5 mb-0">Permissions</h3>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Service</th>
                                <th>Créer</th>
                                <th>Lire</th>
                                <th>Modifier</th>
                                <th>Supprimer</th>
                                <th>Tout</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let service of services; let i = index">
                                <td>{{ service.name }}</td>
                                <td>
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input"
                                            [(ngModel)]="updateRole.permissions[i].canCreate" [name]="'canCreate' + i">
                                    </div>
                                </td>
                                <td>
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input"
                                            [(ngModel)]="updateRole.permissions[i].canRead" [name]="'canRead' + i">
                                    </div>
                                </td>
                                <td>
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input"
                                            [(ngModel)]="updateRole.permissions[i].canUpdate" [name]="'canUpdate' + i">
                                    </div>
                                </td>
                                <td>
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input"
                                            [(ngModel)]="updateRole.permissions[i].canDelete" [name]="'canDelete' + i">
                                    </div>
                                </td>
                                <td>
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input"
                                            [checked]="isAllSelected(updateRole.permissions[i])"
                                            (change)="toggleAllPermissions(updateRole.permissions[i], $event)">
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary" (click)="onSubmit()">
                Mettre à jour
            </button>
            <button type="button" class="btn btn-secondary" (click)="onReset()">
                Réinitialiser
            </button>
        </div>
    </div>
</div>
