quarkus.datasource.db-kind=mariadb
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL}/${DB_NAME}
%test.quarkus.datasource.jdbc.url=${DB_URL}/${DB_NAME_TEST}
quarkus.hibernate-orm.database.generation=update
# Activer CORS
quarkus.http.cors=true
# Autoriser l'origine du frontend
quarkus.http.cors.origins=http://localhost:4200
# Méthodes HTTP autorisées
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
# Autoriser les en-têtes spécifiques si nécessaires
quarkus.http.cors.headers=Content-Type,Authorization
# Permettre l'envoi des cookies ou des identifiants (si nécessaire)
quarkus.http.cors.access-control-allow-credentials=true
keycloak.url=${KEYCLOAK_URL}
keycloak.realm=${KEYCLOAK_REALM}
keycloak.client-id=${KEYCLOAK_CLIENT_ID}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
keycloak.admin.name = ${KEYCLOAK_ADMIN_NAME}
keycloak.admin.password = ${KEYCLOAK_ADMIN_PASSWORD}

quarkus.oidc.auth-server-url=${keycloak.url}/realms/${keycloak.realm}
quarkus.oidc.client-id=${keycloak.client-id}
quarkus.oidc.credentials.secret=${keycloak.client-secret}
quarkus.oidc.tls.verification=none